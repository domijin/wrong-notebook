version: '3'

services:
  wrong-notebook:
    # Build from this checkout so local/self-hosted deployments run the code in
    # this repository (including the i18n work) instead of whatever
    # ghcr.io/wttwins/wrong-notebook:latest happens to publish. Swap the tag for
    # a digest or the upstream image if you want to track upstream releases.
    image: wrong-notebook:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wrong-notebook
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    # Use Tailscale Serve to proxy https://<machine>.<tailnet>.ts.net to localhost:3000.
    # Set NEXTAUTH_URL to that HTTPS URL; tailnet ACLs restrict access.
    environment:
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # First start only: no built-in admin credentials. Remove password after provisioning.
      - AI_ALLOWED_ORIGINS=${AI_ALLOWED_ORIGINS:-}
      # 可信反向代理写入客户端 IP 的请求头，启用按 IP 的登录限流（见 SECURITY.md）
      - AUTH_CLIENT_IP_HEADER=${AUTH_CLIENT_IP_HEADER:-}
      # AI 每日上限与 MiniMax 套餐余量保护（见 SECURITY.md）
      - AI_DAILY_LIMIT_PER_USER=${AI_DAILY_LIMIT_PER_USER:-200}
      - AI_DAILY_LIMIT_SITE=${AI_DAILY_LIMIT_SITE:-1500}
      - AI_QUOTA_MIN_WEEKLY_PERCENT=${AI_QUOTA_MIN_WEEKLY_PERCENT:-25}
      - AI_QUOTA_MIN_INTERVAL_PERCENT=${AI_QUOTA_MIN_INTERVAL_PERCENT:-10}
      - AI_QUOTA_TIMEZONE=${AI_QUOTA_TIMEZONE:-Asia/Shanghai}
      # NEXTAUTH_URL 根据实际情况设置你的信息
      - NEXTAUTH_URL=${NEXTAUTH_URL:?Set the Tailscale HTTPS URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set a random secret of at least 32 characters}
    volumes:
      # Persist the SQLite database
      - ./data:/app/data
      - ./config:/app/config
  # Optional public access through a Cloudflare Tunnel (enable with COMPOSE_PROFILES=tunnel).
  # The connector dials out to Cloudflare, so no inbound port is opened. It reaches the app
  # over the compose network, and Cloudflare's CF-Connecting-IP header arrives unchanged:
  # set AUTH_CLIENT_IP_HEADER=CF-Connecting-IP. Setup: deploy/README.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: wrong-notebook-tunnel
    profiles: ["tunnel"]
    restart: always
    # Run as the host user that owns ./cloudflared so the credentials file can stay 0600.
    user: "${CLOUDFLARED_UID:-65532}"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # Keep the credentials outside the deploy folder so a code sync can never delete them.
      - ${CLOUDFLARED_DIR:-./cloudflared}:/etc/cloudflared:ro
    depends_on:
      - wrong-notebook
